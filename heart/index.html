<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3d2918" />
    <title>Ego Heart</title>
    <link rel="icon" href="css/favicon.png?v=1" type="image/png" sizes="64x64" />
    <link rel="icon" href="css/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css?v=46" />
  </head>
  <body class="painter" data-local="true">
    <p class="turn" id="turn">Turn sideways to carve</p>
    <canvas id="canvas"></canvas>
    <p class="status" id="status" hidden>Connecting</p>
    <footer class="dock" id="dock">
      <div class="dock-bar">
        <button class="step" id="undo" type="button" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.11 9.15A8.3 8.3 0 1 0 12.3 5" />
            <path d="M12.3 2.4 8.4 5l3.9 2.6" />
          </svg>
        </button>
        <button class="step" id="redo" type="button" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.89 9.15A8.3 8.3 0 1 1 11.7 5" />
            <path d="M11.7 2.4 15.6 5l-3.9 2.6" />
          </svg>
        </button>
        <button class="erase" id="erase" type="button">Clear Carving</button>
        <button class="step" id="tools-toggle" type="button" aria-expanded="false" aria-label="Show tools">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 14.5 12 8.5 18 14.5" />
          </svg>
        </button>
      </div>
      <div class="tray">
        <div class="tray-clip">
          <div class="tools">
            <div class="section">
              <span class="section-label">Color</span>
              <div class="section-controls">
                <div class="tune">
                  <span class="section-note">Double-click to edit</span>
                  <div class="swatches" id="swatches"></div>
                </div>
              </div>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="section">
              <span class="section-label">Stroke</span>
              <div class="section-controls">
                <div class="tune">
                  <span class="tune-label">Size</span>
                  <div class="sizes" id="sizes"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Softness</span>
                  <div class="effects" id="softness"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Edge</span>
                  <div class="effects" id="edges"></div>
                </div>
              </div>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="section">
              <span class="section-label">Glow</span>
              <div class="section-controls">
                <div class="tune">
                  <span class="tune-label">Bloom</span>
                  <div class="effects" id="blooms"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Spread</span>
                  <div class="effects" id="spreads"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Distance</span>
                  <div class="effects" id="distances"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Position</span>
                  <div class="effects" id="positions"></div>
                </div>
              </div>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="section">
              <span class="section-label">Texture</span>
              <div class="section-controls">
                <div class="tune">
                  <span class="tune-label">Heat</span>
                  <div class="effects" id="heats"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Scale</span>
                  <div class="effects" id="grains"></div>
                </div>
                <div class="tune">
                  <span class="tune-label">Softness</span>
                  <div class="effects" id="heat-soft"></div>
                </div>
              </div>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <div class="section">
              <span class="section-label" aria-hidden="true"></span>
              <div class="section-controls">
                <div class="tune">
                  <span class="tune-label" aria-hidden="true"></span>
                  <div class="effects" id="shadows"></div>
                </div>
                <div class="tune">
                  <span class="tune-label" aria-hidden="true"></span>
                  <button class="mask" id="mask" type="button" aria-pressed="false" aria-label="Background">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="3.5" y="5" width="17" height="14" rx="2" />
                      <circle cx="8.5" cy="10" r="1.3" />
                      <path d="M4 16.5 8.4 12.4l3 2.6 3.4-3.6L20 16.8" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <script type="module" src="js/painter.js?v=47"></script>
  </body>
</html>
