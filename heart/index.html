<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3d2918" />
    <title>Ego Heart</title>
    <link rel="stylesheet" href="css/app.css?v=17" />
  </head>
  <body class="painter" data-local="true">
    <canvas id="canvas"></canvas>
    <p class="status" id="status" hidden>Connecting</p>
    <footer class="tools">
      <div class="swatches" id="swatches"></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="sizes" id="sizes"></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="brushes" id="brushes"></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="effects" id="glows"></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="effects" id="shadows"></div>
      <button class="mask" id="mask" type="button" aria-pressed="false" aria-label="Heart mask">
        <svg viewBox="0 0 24 22" aria-hidden="true">
          <path
            d="M12 19.4C12 19.4 3 13.6 3 8.2 3 5.4 5.2 3.4 7.8 3.4c1.6 0 3 .8 4.2 2.3C13.2 4.2 14.6 3.4 16.2 3.4 18.8 3.4 21 5.4 21 8.2c0 5.4-9 11.2-9 11.2z"
          />
        </svg>
      </button>
      <button class="step" id="undo" type="button" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.11 9.15A8.3 8.3 0 1 0 12.3 5" />
          <path d="M12.3 2.4 8.4 5l3.9 2.6" />
        </svg>
      </button>
      <button class="step" id="redo" type="button" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.89 9.15A8.3 8.3 0 1 1 11.7 5" />
          <path d="M11.7 2.4 15.6 5l-3.9 2.6" />
        </svg>
      </button>
      <button class="erase" id="erase" type="button">Erase</button>
    </footer>
    <script type="module" src="js/painter.js?v=17"></script>
  </body>
</html>
